# Cloudflare Worker for the staff area. Step by step setup: docs/SETUP.md
name = "flickers-staff-api"
main = "src/index.js"
compatibility_date = "2025-01-01"

[vars]
GITHUB_REPO = "flickerscomics/flickerscomics.github.io"
GITHUB_BRANCH = "main"
# Origins allowed to call the API. Add "http://localhost:8080" while testing locally.
ALLOWED_ORIGINS = "https://flickerscomics.github.io"
# The shop customers see. The Worker reads prices and stock from here when an order comes in.
SITE_URL = "https://flickerscomics.github.io"
# Public order endpoint. Keep "false" until the shop is ready to take real orders (docs/DISCORD.md).
ORDERS_ENABLED = "true"
# Fleeca online payments (docs/FLEECA.md). Needs the secret FLEECA_API_KEY. Keep "false" until the Merchant Center addresses are set.
FLEECA_PAYMENTS = "true"
# 0 = sandbox (nothing is charged), 1 = live
FLEECA_MODE = "1"
# Optional: the id of a Discord role to ping on every new order.
# DISCORD_PING_ROLE = "123456789012345678"

# Every 15 minutes: cancel online orders still unpaid after 30 minutes and put their comics back.
# Every day at 19:00 UTC (8 PM UTC+1): post the daily briefing to the staff Discord channel.
[triggers]
crons = ["*/15 * * * *", "0 19 * * *"]

# Create the namespace with:  npx wrangler kv namespace create USERS
# then paste the id it prints below.
[[kv_namespaces]]
binding = "USERS"
id = "e2534491249a49fe83ca2dd0db40ed25"

# Secrets are not stored in this file. Set them with `npx wrangler secret put NAME`:
#   SESSION_SECRET   a long random string
#   SETUP_KEY        a one-time key used to create the first owner account
#   GITHUB_TOKEN     fine-grained GitHub token: this repo only, Contents: read and write
#   DISCORD_WEBHOOK_URL  the Discord channel webhook for order messages
#   FLEECA_API_KEY   the Fleeca merchant API key (only needed for online payments)
