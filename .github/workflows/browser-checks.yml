name: Browser checks

# Drives a real browser through the shop and the staff area (qa/): ordering, search, filters, the wanted list, the staff tabs, accessibility.
# It runs after every push to main but is separate from the deploy, so a slow or flaky run never holds the site back.
# If it fails, the run page shows a short summary of what went wrong, and the full logs and screenshots are in the "browser-check-logs" download.
# "Run workflow" starts it by hand.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-checks
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci
        working-directory: qa
      - uses: actions/cache@v4
        with:
          path: .cache
          key: covers-${{ hashFiles('assets/covers/**', 'build/build.mjs') }}
          restore-keys: covers-
      - name: Browser version
        run: google-chrome --version
      - name: Run the browser checks
        env:
          QA_BROWSER: /usr/bin/google-chrome
        run: node qa/run.mjs 2>&1 | tee run.log; exit "${PIPESTATUS[0]}"
      - name: Summarise what failed
        if: failure()
        run: node qa/ci-report.mjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-check-logs
          path: |
            run.log
            /tmp/flickers-qa
          if-no-files-found: ignore
